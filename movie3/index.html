<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API 활용 영화 웹사이트</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #0b1220;
        color: #f4f7ff;
      }
      .title-section {
        text-align: center;
        margin-bottom: 40px;
        margin-top: 50px;
      }

      .lab-badge {
        display: inline-block;
        background: #f0e6d3;
        color: #8b6914;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 15px;
      }
      .menu {
        text-align: center;
        margin-top: 50px;
      }
      #movieBoard {
        width: 90%;
        margin: 50px auto;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
        border: 4px solid rgba(255, 255, 255, 0.55);
        border-radius: 22px;
        padding: 20px;
      }
      button {
        min-width: 140px;
        padding: 14px 20px;
        border: none;
        border-radius: 10px;
        background: #c53e3e;
        color: white;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          background 0.2s ease,
          color 0.2s ease,
          box-shadow 0.2s ease;
      }
      button:hover {
        transform: translateY(-2px);
        background: #000;
        color: #fff;
        box-shadow: 0 14px 25px rgba(255, 255, 255, 0.18);
      }
      input#searchInput {
        width: 300px;
        max-width: 90vw;
        padding: 14px 16px;
        margin-right: 12px;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        color: #f4f7ff;
        font-size: 1rem;
        outline: none;
        transition:
          border-color 0.2s ease,
          background 0.2s ease;
      }
      input#searchInput:focus {
        border-color: #ffffff;
        background: rgba(255, 255, 255, 0.12);
      }
      #movieBoard .card {
        width: calc((100% - 60px) / 4);
        text-align: center;
        border-radius: 18px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.04);
        border: 2px solid transparent;
        transition:
          transform 0.25s ease,
          border-color 0.25s ease,
          box-shadow 0.25s ease;
        box-shadow: 0 18px 35px rgba(0, 0, 0, 0.14);
      }
      #movieBoard .card:hover {
        transform: scale(1.04);
        border-color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 26px 60px rgba(0, 0, 0, 0.25);
      }
      .imgBox {
        position: relative;
        width: 100%;
        height: 400px;
        overflow: hidden;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.35s ease;
      }
      .card:hover img {
        transform: scale(1.06);
      }
      .overview {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 20px;
        color: #fff;
        font-size: 0.9rem;
        text-align: left;
        line-height: 1.5;
        opacity: 0;
        overflow-y: auto;
        align-items: center;
      }
      .avg {
        position: absolute;
        bottom: 10px;
        width: 20%;
        text-align: center;
        background: rgba(255, 255, 255, 0.5);
        color: #333;
        padding: 5px;
        font-size: 0.8rem;
        opacity: 0;
      }
      .avg span {
        color: red;
      }
      .card:hover .overview,
      .card:hover .avg {
        opacity: 1;
      }

      h2 {
        font-weight: normal;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      .search {
        margin-top: 50px;
        text-align: center;
      }
      #more {
        display: block;
        margin: 40px auto 70px;
        padding: 14px 26px;
        border-radius: 12px;
        background: #c53e3e;
        color: white;
        font-size: 1rem;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          background 0.2s ease,
          box-shadow 0.2s ease;
      }
      #more:hover {
        transform: translateY(-2px);
        background: #000;
        color: #fff;
        box-shadow: 0 14px 25px rgba(255, 255, 255, 0.18);
      }
    </style>
  </head>
  <body>
    <div class="title-section">
      <span class="lab-badge">LAB EXPERIMENT #3</span>
    </div>
    <div class="menu">
      <button onclick="movie('now_playing')">현재상영영화</button>
      <button onclick="movie('popular')">인기영화</button>
      <button onclick="movie('top_rated')">추천영화</button>
      <button onclick="movie('upcoming')">상영예정영화</button>
    </div>

    <div class="search">
      <input id="searchInput" placeholder="영화 제목을 입력하세요" />
      <button id="searchBtn">검색</button>
    </div>

    <div id="movieBoard"></div>
    <button id="more">더보기</button>
    <script src="custom.js"></script>
  </body>
</html>
